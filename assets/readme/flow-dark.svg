<svg xmlns="http://www.w3.org/2000/svg" width="900" height="128" viewBox="0 0 900 128" role="img" aria-label="How Hunu works: Parse → Fetch → Normalise → Rank → Show">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef5ec} .kick{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:1.5px;fill:#f2b705}.n{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#f2b705;font-size:10.5px;font-weight:700} .h{font-size:14px;font-weight:700} .s{fill:#93a998;font-size:11px}.on{opacity:0;animation:on 5.30s ease infinite}@keyframes on{0%{opacity:0}4%{opacity:.16}18%{opacity:.16}30%,100%{opacity:0}}.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:tr 5.30s linear infinite}@keyframes tr{0%{stroke-dashoffset:1}88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}.dot{animation:dot 5.30s cubic-bezier(.65,0,.25,1) infinite}@keyframes dot{0%{transform:translateX(100px);opacity:0}5%{opacity:1}88%{transform:translateX(800px);opacity:1}100%{transform:translateX(800px);opacity:0}}</style>
