<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1d2a1f}.kick{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:1.5px;fill:#c58f00}.nm{font-size:32px;font-weight:700;letter-spacing:-0.5px}.tags{font-size:12.5px;fill:#5f6b5f} .tg{font-size:15px}.l{opacity:0;animation:in .7s cubic-bezier(.2,1.2,.35,1) forwards}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.k{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.tg0{animation:tg0 5s cubic-bezier(.65,0,.25,1) infinite}@keyframes tg0{0%,25%{transform:translateY(52px)}50%,90%{transform:translateY(132px)}100%{transform:translateY(52px)}}.tg1{animation:tg1 5s cubic-bezier(.65,0,.25,1) infinite}@keyframes tg1{0%,25%{transform:translateY(92px)}50%,90%{transform:translateY(52px)}100%{transform:translateY(92px)}}.tg2{animation:tg2 5s cubic-bezier(.65,0,.25,1) infinite}@keyframes tg2{0%,25%{transform:translateY(132px)}50%,90%{transform:translateY(172px)}100%{transform:translateY(132px)}}.tg3{animation:tg3 5s cubic-bezier(.65,0,.25,1) infinite}@keyframes tg3{0%,25%{transform:translateY(172px)}50%,90%{transform:translateY(92px)}100%{transform:translateY(172px)}}</style>
