<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunu development preview</title>
  </head>
  <body style="margin:0;padding:24px;background:#f1efe8;font-family:Segoe UI,system-ui,sans-serif;color:#111">
    <div style="max-width:1100px;margin:0 auto">
      <div style="background:#ffd100;border:2px solid #111;border-radius:6px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px">
        <div>
          <h1 style="margin:0;font-size:20px">Hunu development preview</h1>
          <p style="margin:2px 0 0;font-size:13px;color:#4a3f00">Popup and side panel, running outside the browser extension.</p>
        </div>
        <div style="display:flex;gap:8px">
          <a href="/popup.html" target="_blank" style="padding:6px 10px;border:2px solid #111;border-radius:4px;background:#fff;color:#111;font-weight:600;font-size:13px;text-decoration:none">
            Open popup
          </a>
          <a href="/sidepanel.html" target="_blank" style="padding:6px 10px;border:2px solid #111;border-radius:4px;background:#111;color:#fff;font-weight:600;font-size:13px;text-decoration:none">
            Open side panel
          </a>
        </div>
      </div>

      <div style="border:2px solid #111;border-radius:6px;overflow:hidden;background:#fff">
        <iframe src="/sidepanel.html" style="width:100%;height:760px;border:0;display:block"></iframe>
      </div>
    </div>
  </body>
</html>
